services:
  search-api:
    build: .
    # ES + Mongo are on the host, so use host networking (localhost reachable).
    network_mode: host
    env_file: .env
    volumes:
      # The CA cert lives outside the build context; mount it to the in-container
      # path that ES_CA_CERTS in .env points to.
      - ../Autocomplete-new/config/ca.crt:/app/config/ca.crt:ro
    restart: unless-stopped
